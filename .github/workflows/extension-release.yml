name: Publish extension release

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=ext-v$v" >> "$GITHUB_OUTPUT"

      - name: Zip the extension
        run: |
          cd extension && zip -r "../esic-extension-v${{ steps.ver.outputs.version }}.zip" . -x "*.DS_Store"

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ESIC Extension v${{ steps.ver.outputs.version }}
          body: |
            Chrome extension build v${{ steps.ver.outputs.version }}.

            Install: download + unzip → chrome://extensions/ → Developer mode → Load unpacked.
            Or use the web tool to always get the latest: https://rcstrue.github.io/esicip/
          files: esic-extension-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
