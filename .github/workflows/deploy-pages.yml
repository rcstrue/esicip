name: Deploy web tool to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/lib/esic/**"
      - "extension/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # The lib is pure TypeScript with no external deps, so no install needed.
      - name: Build lib bundle for the static site
        run: bun build src/lib/esic/browser.ts --outfile docs/lib.bundle.js --target browser

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
